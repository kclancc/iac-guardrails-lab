name: FCS IaC Scan

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/Dockerfile'
      - '**/Dockerfile.*'

jobs:
  fcs-iac:
    name: FCS IaC Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write     # required to post the sticky PR comment
      security-events: write   # required to upload SARIF to Code Scanning (GHAS)

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Run FCS IaC scan
        id: scan
        uses: crowdstrike/fcs-action@v5.0.2
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: ${{ secrets.FALCON_CLOUD }}
          scan_type: iac
          path: .
          report_formats: sarif
          output_path: fcs-report.json      # action rewrites .json here, then converts to fcs-report.sarif alongside
          fail_on: high=1,critical=1
          exclude_severities: medium,informational   # keep the report focused on merge-blocking findings
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      # Demo variant: GHAS-only path (no sticky PR comment).
      # This branch simulates a repo that relies entirely on GitHub Advanced
      # Security's inline annotations for reviewer feedback. Comment out the
      # render + sticky steps so nothing posts to the Conversation tab.
      #
      # - name: Render SARIF as Markdown
      #   if: always()
      #   run: python3 scripts/sarif-to-md.py fcs-report.sarif pr-comment.md
      #
      # - name: Post/update sticky PR comment
      #   if: always() && github.event_name == 'pull_request'
      #   uses: marocchino/sticky-pull-request-comment@v2
      #   with:
      #     header: fcs-iac                 # sticky comment key -- updates in place
      #     path: pr-comment.md

      - name: Upload SARIF to GitHub Code Scanning (GHAS only)
        if: always()
        continue-on-error: true          # silently skip on non-GHAS repos
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fcs-report.sarif
          category: FCS

      - name: Fail job on high-severity findings
        if: steps.scan.outputs.exit-code != '0'
        run: |
          echo "::error::FCS IaC scan found high-severity issues. See sticky PR comment."
          exit 1
